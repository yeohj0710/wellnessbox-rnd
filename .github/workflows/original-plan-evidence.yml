name: Original plan evidence

on:
  pull_request:
    paths:
      - ".github/workflows/original-plan-evidence.yml"
      - "apps/inference_api/routes/recommend.py"
      - "data/original_plan/**"
      - "data/knowledge/runtime_knowledge_db_v1.json"
      - "data/catalog/ingredients.json"
      - "data/rules/safety_rules.json"
      - "data/samples/api_recommend_structured_health_input_request_v1.json"
      - "data/samples/api_recommend_structured_safety_block_request_v1.json"
      - "data/samples/api_recommend_diet_lifestyle_lab_request_v1.json"
      - "docs/context/original_plan.pdf"
      - "docs/original_plan/**"
      - "docs/plans/2026-07-15-original-plan-completion-program.md"
      - "scripts/audit_original_plan_requirements.py"
      - "scripts/build_original_plan_completion_report.py"
      - "src/wellnessbox_rnd/governance/**"
      - "src/wellnessbox_rnd/knowledge/runtime_db.py"
      - "src/wellnessbox_rnd/domain/catalog.py"
      - "src/wellnessbox_rnd/domain/loaders.py"
      - "src/wellnessbox_rnd/domain/intake.py"
      - "src/wellnessbox_rnd/models/efficacy_model_v0.py"
      - "src/wellnessbox_rnd/models/effect_model_v1.py"
      - "src/wellnessbox_rnd/models/policy_model_v0.py"
      - "src/wellnessbox_rnd/models/policy_model_v1.py"
      - "src/wellnessbox_rnd/schemas/recommendation.py"
      - "src/wellnessbox_rnd/safety/**"
      - "src/wellnessbox_rnd/simulation/closed_loop_v0.py"
      - "src/wellnessbox_rnd/synthetic/rich_longitudinal_v2.py"
      - "src/wellnessbox_rnd/synthetic/rich_longitudinal_v3.py"
      - "src/wellnessbox_rnd/synthetic/rich_longitudinal_v4.py"
      - "src/wellnessbox_rnd/synthetic/longitudinal.py"
      - "src/wellnessbox_rnd/schemas/original_plan_manifest.py"
      - "tests/test_original_plan_audit*.py"
      - "tests/test_original_plan_completion_report.py"
      - "tests/test_original_plan_manifest.py"
      - "tests/test_health_input_contracts.py"
      - "tests/test_medication_supplement_input_contracts.py"
      - "tests/test_diet_lifestyle_lab_input_contracts.py"
      - "tests/test_inference_api.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/original-plan-evidence.yml"
      - "apps/inference_api/routes/recommend.py"
      - "data/original_plan/**"
      - "data/knowledge/runtime_knowledge_db_v1.json"
      - "data/catalog/ingredients.json"
      - "data/rules/safety_rules.json"
      - "data/samples/api_recommend_structured_health_input_request_v1.json"
      - "data/samples/api_recommend_structured_safety_block_request_v1.json"
      - "data/samples/api_recommend_diet_lifestyle_lab_request_v1.json"
      - "docs/context/original_plan.pdf"
      - "docs/original_plan/**"
      - "docs/plans/2026-07-15-original-plan-completion-program.md"
      - "scripts/audit_original_plan_requirements.py"
      - "scripts/build_original_plan_completion_report.py"
      - "src/wellnessbox_rnd/governance/**"
      - "src/wellnessbox_rnd/knowledge/runtime_db.py"
      - "src/wellnessbox_rnd/domain/catalog.py"
      - "src/wellnessbox_rnd/domain/loaders.py"
      - "src/wellnessbox_rnd/domain/intake.py"
      - "src/wellnessbox_rnd/models/efficacy_model_v0.py"
      - "src/wellnessbox_rnd/models/effect_model_v1.py"
      - "src/wellnessbox_rnd/models/policy_model_v0.py"
      - "src/wellnessbox_rnd/models/policy_model_v1.py"
      - "src/wellnessbox_rnd/schemas/recommendation.py"
      - "src/wellnessbox_rnd/safety/**"
      - "src/wellnessbox_rnd/simulation/closed_loop_v0.py"
      - "src/wellnessbox_rnd/synthetic/rich_longitudinal_v2.py"
      - "src/wellnessbox_rnd/synthetic/rich_longitudinal_v3.py"
      - "src/wellnessbox_rnd/synthetic/rich_longitudinal_v4.py"
      - "src/wellnessbox_rnd/synthetic/longitudinal.py"
      - "src/wellnessbox_rnd/schemas/original_plan_manifest.py"
      - "tests/test_original_plan_audit*.py"
      - "tests/test_original_plan_completion_report.py"
      - "tests/test_original_plan_manifest.py"
      - "tests/test_health_input_contracts.py"
      - "tests/test_medication_supplement_input_contracts.py"
      - "tests/test_diet_lifestyle_lab_input_contracts.py"
      - "tests/test_inference_api.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install audit dependencies
        run: python -m pip install -e ".[dev,interim]"
      - name: Audit requirement evidence
        run: python scripts/audit_original_plan_requirements.py
      - name: Check generated completion report
        run: python scripts/build_original_plan_completion_report.py --check
      - name: Run requirement contract tests
        run: >-
          python -m pytest
          tests/test_original_plan_manifest.py
          tests/test_original_plan_audit.py
          tests/test_original_plan_audit_cli.py
          tests/test_original_plan_completion_report.py
          tests/test_health_input_contracts.py
          tests/test_medication_supplement_input_contracts.py
          tests/test_diet_lifestyle_lab_input_contracts.py
          tests/test_inference_api.py
      - name: Lint requirement audit
        run: >-
          python -m ruff check
          scripts/audit_original_plan_requirements.py
          scripts/build_original_plan_completion_report.py
          src/wellnessbox_rnd/governance
          src/wellnessbox_rnd/knowledge/runtime_db.py
          src/wellnessbox_rnd/schemas/original_plan_manifest.py
          src/wellnessbox_rnd/domain/catalog.py
          src/wellnessbox_rnd/domain/loaders.py
          tests/test_original_plan_manifest.py
          tests/test_original_plan_audit.py
          tests/test_original_plan_audit_cli.py
          tests/test_original_plan_completion_report.py
          apps/inference_api/routes/recommend.py
          src/wellnessbox_rnd/domain/intake.py
          src/wellnessbox_rnd/models/efficacy_model_v0.py
          src/wellnessbox_rnd/models/effect_model_v1.py
          src/wellnessbox_rnd/models/policy_model_v0.py
          src/wellnessbox_rnd/models/policy_model_v1.py
          src/wellnessbox_rnd/schemas/recommendation.py
          src/wellnessbox_rnd/safety
          src/wellnessbox_rnd/simulation/closed_loop_v0.py
          src/wellnessbox_rnd/synthetic/rich_longitudinal_v2.py
          src/wellnessbox_rnd/synthetic/rich_longitudinal_v3.py
          src/wellnessbox_rnd/synthetic/rich_longitudinal_v4.py
          src/wellnessbox_rnd/synthetic/longitudinal.py
          tests/test_health_input_contracts.py
          tests/test_medication_supplement_input_contracts.py
          tests/test_diet_lifestyle_lab_input_contracts.py
          tests/test_inference_api.py
