permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      WELLNESSBOX_EVIDENCE_ROOT: ${{ github.workspace }}/_evidence/wellnessbox
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Checkout WellnessBox service evidence
        uses: actions/checkout@v7
        with:
          repository: yeohj0710/wellnessbox
          ref: a6b8ab1e92a112f6d2e904436bfe44ba688fc4e8
          fetch-depth: 0
          path: _evidence/wellnessbox
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: _evidence/wellnessbox/package-lock.json
      - name: Install audit dependencies
        run: python -m pip install -e ".[dev,interim]"
      - name: Install WellnessBox service dependencies
        working-directory: _evidence/wellnessbox
        run: npm ci
      - name: Audit requirement evidence
        run: python scripts/audit_original_plan_requirements.py
      - name: Check generated completion report
        run: python scripts/build_original_plan_completion_report.py --check
      - name: Check interaction and dose aggregation evidence
        run: >-
          python scripts/run_interaction_dose_aggregation_smoke.py
          && git diff --exit-code
          data/original_plan/evidence/op035_op036_interaction_dose_aggregation_smoke_v1.json
      - name: Check dose-limit and rule metadata evidence
        run: >-
          python scripts/run_dose_limit_fail_closed_rule_metadata_smoke.py
          && git diff --exit-code
          data/original_plan/evidence/op037_op038_dose_limit_rule_metadata_smoke_v1.json
      - name: Check final safety authority two-process evidence
        run: >-
          python scripts/run_wellnessbox_final_safety_authority_smoke.py
          && git diff --exit-code
          data/original_plan/evidence/op040_final_safety_authority_integration_smoke_v1.json
      - name: Check ingredient mapping and goal-prior evidence
        run: >-
          python scripts/run_ingredient_mapping_goal_prior_smoke.py
          && git diff --exit-code
          data/original_plan/evidence/op041_op042_ingredient_mapping_goal_prior_smoke_v1.json
      - name: Check candidate signal scoring evidence
        run: >-
          python scripts/run_candidate_signal_scoring_smoke.py
          && git diff --exit-code
          data/original_plan/evidence/op043_op044_candidate_signal_scoring_smoke_v1.json
      - name: Check candidate-pool and structured-reason evidence
        run: >-
          python scripts/run_candidate_pool_structured_reasons_smoke.py
          && git diff --exit-code
          data/original_plan/evidence/op045_op046_candidate_pool_structured_reasons_smoke_v1.json
      - name: Check uncertainty and learned-fallback evidence
        run: >-
          python scripts/run_decision_uncertainty_learned_fallback_smoke.py
          && git diff --exit-code
          data/original_plan/evidence/op047_op048_decision_uncertainty_learned_fallback_smoke_v1.json
      - name: Check learned replay and service product-candidate evidence
        run: >-
          python scripts/run_learned_replay_product_candidates_smoke.py
          && git diff --exit-code
          data/original_plan/evidence/op049_op050_replay_product_candidates_smoke_v1.json
      - name: Check versioned PRO scoring and baseline-percentile evidence
        run: >-
          python scripts/run_versioned_pro_scoring_baseline_percentile_smoke.py
          && git diff --exit-code
          data/original_plan/evidence/op051_op052_versioned_pro_scoring_smoke_v1.json
      - name: Check PRO follow-up persistence and interpretation evidence
        run: >-
          python scripts/run_pro_followup_adherence_interpretation_smoke.py
          && git diff --exit-code
          data/original_plan/evidence/op053_op054_pro_followup_interpretation_smoke_v1.json
      - name: Run requirement contract tests
        run: >-
          python -m pytest
          tests/test_original_plan_manifest.py
          tests/test_original_plan_audit.py
          tests/test_original_plan_audit_cli.py
          tests/test_original_plan_completion_report.py
          tests/test_health_input_contracts.py
