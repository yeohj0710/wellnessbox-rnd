permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      WELLNESSBOX_EVIDENCE_ROOT: ${{ github.workspace }}/_evidence/wellnessbox
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Checkout WellnessBox service evidence
        uses: actions/checkout@v7
        with:
          repository: yeohj0710/wellnessbox
          ref: a24b6c3308cc76627c3ca29807db1705e32c2178
          fetch-depth: 0
          path: _evidence/wellnessbox
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: _evidence/wellnessbox/package-lock.json
      - name: Install audit dependencies
        run: python -m pip install -e ".[dev,interim]"
      - name: Install WellnessBox service dependencies
        working-directory: _evidence/wellnessbox
        run: npm ci
      - name: Checkout OP-103/104 WellnessBox evidence
        uses: actions/checkout@v7
        with:
          repository: yeohj0710/wellnessbox
          ref: 5f1d42015d6a467a717d69f3aaa8a7e2afd06931
          fetch-depth: 0
          path: _evidence/wellnessbox-op104
      - name: Run OP-103/104 service contract QA
        working-directory: _evidence/wellnessbox-op104
        run: npm ci && npx tsx scripts/qa/check-rnd-environment-result-origin.cts
      - name: Checkout OP-105/106 WellnessBox evidence
        uses: actions/checkout@v7
        with:
          repository: yeohj0710/wellnessbox
          ref: fb00e4ebd972a6630235dda8b09593d27e277ccd
          fetch-depth: 0
          path: _evidence/wellnessbox-op106
      - name: Install OP-105/106 service dependencies
        working-directory: _evidence/wellnessbox-op106
        run: npm ci
      - name: Checkout OP-107/108 WellnessBox evidence
        uses: actions/checkout@v7
        with:
          repository: yeohj0710/wellnessbox
          ref: e95592a126cdb2bfeec156d4f4d7de43487e2a63
          fetch-depth: 0
          path: _evidence/wellnessbox-op108
      - name: Install OP-107/108 service dependencies
        working-directory: _evidence/wellnessbox-op108
        run: npm ci
      - name: Checkout OP-109/110 WellnessBox evidence
        uses: actions/checkout@v7
        with:
          repository: yeohj0710/wellnessbox
          ref: 67ce9fc905202e8d6b4dd54a1dc45a77ca539357
          fetch-depth: 0
          path: _evidence/wellnessbox-op110
      - name: Install OP-109/110 service dependencies
        working-directory: _evidence/wellnessbox-op110
        run: npm ci
      - name: Audit requirement evidence
        env:
          WELLNESSBOX_EVIDENCE_ROOT: ${{ github.workspace }}/_evidence/wellnessbox-op110
        run: python scripts/audit_original_plan_requirements.py
      - name: Check generated completion report
        env:
          WELLNESSBOX_EVIDENCE_ROOT: ${{ github.workspace }}/_evidence/wellnessbox-op110
        run: python scripts/build_original_plan_completion_report.py --check
      - name: Check interaction and dose aggregation evidence
        run: >-
          python scripts/run_interaction_dose_aggregation_smoke.py
          && git diff --exit-code
          data/original_plan/evidence/op035_op036_interaction_dose_aggregation_smoke_v1.json
      - name: Check dose-limit and rule metadata evidence
        run: >-
          python scripts/run_dose_limit_fail_closed_rule_metadata_smoke.py
          && git diff --exit-code
