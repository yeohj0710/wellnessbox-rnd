          tests/test_consent_and_input_hash_contracts.py
          tests/test_unsupported_input_contracts.py
          tests/test_wellnessbox_profile_adapter_contract.py
          tests/test_inference_api.py
          tests/test_interim_api.py
          tests/test_data_lake_lineage.py
          tests/test_interim_evidence.py
          tests/test_interim_store.py
          tests/test_interim_safety.py
          tests/test_knowledge_lineage.py
          tests/test_log_separation_execution_identity.py
          tests/test_event_idempotency_data_mutation.py
          tests/test_session_replay.py
          tests/test_reference_ingestion.py
          tests/test_runtime_knowledge_db.py
          tests/test_special_population_condition_safety.py
          tests/test_learned_runtime_boundary_audit.py
          tests/test_external_high_risk_safety_eval.py
          tests/test_ingredient_identifier_mapping.py
